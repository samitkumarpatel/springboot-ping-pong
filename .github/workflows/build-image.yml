name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compute image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_ENV"

      - name: Build image
        run: ./mvnw -B spring-boot:build-image -Dspring-boot.build-image.imageName=${IMAGE} -Dspring-boot.build-image.imagePlatform=linux/amd64 -Dspring-boot.build-image.builder=paketobuildpacks/builder-jammy-base:latest

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: docker push ${IMAGE}
